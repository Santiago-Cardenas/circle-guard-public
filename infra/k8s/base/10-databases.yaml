apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init-db.sql: |
    SELECT 'CREATE DATABASE circleguard_auth'       WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'circleguard_auth')\gexec
    SELECT 'CREATE DATABASE circleguard_identity'   WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'circleguard_identity')\gexec
    SELECT 'CREATE DATABASE circleguard_promotion'  WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'circleguard_promotion')\gexec
    SELECT 'CREATE DATABASE circleguard_dashboard'  WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'circleguard_dashboard')\gexec
    SELECT 'CREATE DATABASE circleguard_form'       WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'circleguard_form')\gexec
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, valueFrom: { configMapKeyRef: { name: circleguard-config, key: POSTGRES_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: circleguard-secrets, key: POSTGRES_PASSWORD } } }
            - { name: POSTGRES_DB, value: "circleguard" }
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["pg_isready","-U","admin"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - { name: init, configMap: { name: postgres-init } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: neo4j }
spec:
  replicas: 1
  selector: { matchLabels: { app: neo4j } }
  template:
    metadata: { labels: { app: neo4j } }
    spec:
      enableServiceLinks: false
      containers:
        - name: neo4j
          image: neo4j:5.26
          ports: [{ containerPort: 7474 }, { containerPort: 7687 }]
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
          env:
            - { name: NEO4J_AUTH, value: "neo4j/password" }
            - { name: NEO4J_PLUGINS, value: '["apoc"]' }
            - { name: NEO4J_server_memory_heap_initial__size, value: "128m" }
            - { name: NEO4J_server_memory_heap_max__size,     value: "256m" }
            - { name: NEO4J_server_memory_pagecache__size,    value: "64m" }
---
apiVersion: v1
kind: Service
metadata: { name: neo4j }
spec:
  selector: { app: neo4j }
  ports:
    - { name: http, port: 7474, targetPort: 7474 }
    - { name: bolt, port: 7687, targetPort: 7687 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: openldap }
spec:
  replicas: 1
  selector: { matchLabels: { app: openldap } }
  template:
    metadata: { labels: { app: openldap } }
    spec:
      enableServiceLinks: false
      containers:
        - name: openldap
          image: osixia/openldap:1.5.0
          ports: [{ containerPort: 389 }]
          env:
            - { name: LDAP_ORGANISATION, value: "CircleGuard" }
            - { name: LDAP_DOMAIN, value: "circleguard.edu" }
            - { name: LDAP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: circleguard-secrets, key: LDAP_PASSWORD } } }
---
apiVersion: v1
kind: Service
metadata: { name: openldap }
spec:
  selector: { app: openldap }
  ports: [{ port: 389, targetPort: 389 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mailhog }
spec:
  replicas: 1
  selector: { matchLabels: { app: mailhog } }
  template:
    metadata: { labels: { app: mailhog } }
    spec:
      enableServiceLinks: false
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          ports: [{ containerPort: 1025 }, { containerPort: 8025 }]
---
apiVersion: v1
kind: Service
metadata: { name: mailhog }
spec:
  selector: { app: mailhog }
  ports:
    - { name: smtp, port: 1025, targetPort: 1025 }
    - { name: ui,   port: 8025, targetPort: 8025 }

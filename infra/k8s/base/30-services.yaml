  template:
    metadata: { labels: { app: gateway } }
    spec:
      enableServiceLinks: false
      containers:
        - name: gateway
          image: circleguard/gateway:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8087 }]
          env:
            - { name: SERVER_PORT, value: "8087" }
            - { name: SPRING_DATA_REDIS_HOST, valueFrom: { configMapKeyRef: { name: circleguard-config, key: REDIS_HOST } } }

# =====================================================================
# Microservicios CircleGuard — Deployments + Services
# Imágenes: circleguard/<svc>:dev (locales en Docker Desktop)
# =====================================================================

# ---------- identity ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: identity }
spec:
  replicas: 1
  selector: { matchLabels: { app: identity } }
  template:
    metadata: { labels: { app: identity } }
    spec:
      enableServiceLinks: false
      containers:
        - name: identity
          image: circleguard/identity:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8083 }]
          env:
            - { name: SERVER_PORT, value: "8083" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/circleguard_identity" }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { configMapKeyRef: { name: circleguard-config, key: POSTGRES_USER } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: circleguard-secrets, key: POSTGRES_PASSWORD } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: circleguard-secrets, key: JWT_SECRET } } }
            - { name: VAULT_SECRET, valueFrom: { secretKeyRef: { name: circleguard-secrets, key: VAULT_SECRET } } }
            - { name: VAULT_SALT, valueFrom: { secretKeyRef: { name: circleguard-secrets, key: VAULT_SALT } } }
            - { name: VAULT_HASH_SALT, valueFrom: { secretKeyRef: { name: circleguard-secrets, key: VAULT_HASH_SALT } } }
---
apiVersion: v1
kind: Service
metadata: { name: identity }
spec:
  selector: { app: identity }
  ports: [{ port: 8083, targetPort: 8083 }]
---
# ---------- auth ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth } }
  template:
    metadata: { labels: { app: auth } }
    spec:
      enableServiceLinks: false
      containers:
        - name: auth
          image: circleguard/auth:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8180 }]
          env:
            - { name: SERVER_PORT, value: "8180" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/circleguard_auth" }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { configMapKeyRef: { name: circleguard-config, key: POSTGRES_USER } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: circleguard-secrets, key: POSTGRES_PASSWORD } } }
            - { name: SPRING_LDAP_URLS, valueFrom: { configMapKeyRef: { name: circleguard-config, key: LDAP_URL } } }
            - { name: SPRING_LDAP_BASE, valueFrom: { configMapKeyRef: { name: circleguard-config, key: LDAP_BASE } } }
            - { name: SPRING_LDAP_USERNAME, valueFrom: { configMapKeyRef: { name: circleguard-config, key: LDAP_USER } } }
            - { name: SPRING_LDAP_PASSWORD, valueFrom: { secretKeyRef: { name: circleguard-secrets, key: LDAP_PASSWORD } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: circleguard-secrets, key: JWT_SECRET } } }
            - { name: QR_SECRET, valueFrom: { secretKeyRef: { name: circleguard-secrets, key: QR_SECRET } } }

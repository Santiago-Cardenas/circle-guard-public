  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8087"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      enableServiceLinks: false
      containers:
        - name: gateway
          image: circleguard/gateway:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8087 }]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          envFrom:
            - configMapRef: { name: circleguard-observability }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8087 }
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 6

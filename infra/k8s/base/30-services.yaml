          env:
            - { name: SERVER_PORT, value: "8087" }
            - { name: SPRING_DATA_REDIS_HOST, valueFrom: { configMapKeyRef: { name: circleguard-config, key: REDIS_HOST } } }
            - { name: SPRING_DATA_REDIS_PORT, valueFrom: { configMapKeyRef: { name: circleguard-config, key: REDIS_PORT } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: circleguard-secrets, key: JWT_SECRET } } }
            - { name: QR_SECRET, valueFrom: { secretKeyRef: { name: circleguard-secrets, key: QR_SECRET } } }
            - { name: AUTH_API_URL, valueFrom: { configMapKeyRef: { name: circleguard-config, key: AUTH_API_URL } } }
            - { name: FEATURES_HEALTH_CHECK_ENABLED, valueFrom: { configMapKeyRef: { name: circleguard-config, key: FEATURES_HEALTH_CHECK_ENABLED } } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  type: NodePort
  selector: { app: gateway }
  ports: [{ port: 8087, targetPort: 8087, nodePort: 30087 }]

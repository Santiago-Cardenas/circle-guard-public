# =====================================================================
# FASE 6 Bono C — DestinationRules: connection pool + outlier detection
#
# Circuit breaker a nivel de sidecar (complementa Resilience4j):
# si un pod responde con errores consecutivos se eyecta temporalmente
# del pool de balanceo sin afectar a los demas pods.
# =====================================================================

# --- gateway ---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: gateway-dr
  namespace: circleguard-dev
spec:
  host: gateway
  trafficPolicy:
    connectionPool:
      tcp:  { maxConnections: 100 }
      http: { http1MaxPendingRequests: 100, http2MaxRequests: 500 }
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
# --- identity ---
apiVersion: networking.istio.io/v1alpha3

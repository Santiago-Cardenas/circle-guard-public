# =====================================================================
# FASE 6 Bono C — PeerAuthentication: mTLS en circleguard-dev
#
# Modo PERMISSIVE: el tráfico entre pods con sidecar usa mTLS automático
# (Envoy auto-negocia). El tráfico externo vía NodePort (sin sidecar en
# el cliente) se acepta en texto plano — necesario para acceso local dev.
# En producción con IngressGateway se usaría STRICT puro.
#
# Aplica con: kubectl apply -f infra/k8s/istio/01-mtls-peer-auth.yaml
# Verifica:   istioctl analyze -n circleguard-dev
# =====================================================================
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-mtls
  namespace: circleguard-dev
spec:
  mtls:
    mode: PERMISSIVE
---
# AuthorizationPolicy: permite trafico entre microservicios del namespace
# y desde el namespace de monitoreo (Prometheus scraping).
# En dev con NodePort el trafico externo no tiene principal Istio,
# por lo que se omite la restriccion por namespace y solo se aplica PERMISSIVE mTLS.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-internal
  namespace: circleguard-dev
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - circleguard-dev
              - circleguard-monitoring
              - istio-system
    # Permitir tráfico externo (NodePort, sin principal Istio) — entorno dev
    - {}


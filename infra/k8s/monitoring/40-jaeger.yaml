# =====================================================================
# FASE 5 — Jaeger (tracing distribuido)
#
# Se usa la imagen all-in-one (collector + query + UI + storage en
# memoria), suficiente para entorno local. Lo importante:
#   • Se habilita el collector compatible con ZIPKIN en el puerto 9411,
#     que es a donde los microservicios Spring Boot (Brave) envían sus
#     trazas (ver MANAGEMENT_ZIPKIN_TRACING_ENDPOINT en el ConfigMap
#     de observabilidad).
#   • La UI de Jaeger queda en NodePort 30686.
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: circleguard-monitoring
  labels: { app: jaeger }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.58
          env:
            # Habilita la recepción de spans en formato Zipkin v2.
            - { name: COLLECTOR_ZIPKIN_HOST_PORT, value: ":9411" }
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
          ports:
            - { containerPort: 16686, name: query }    # UI
            - { containerPort: 9411,  name: zipkin }    # ingest Zipkin
            - { containerPort: 4317,  name: otlp-grpc }
            - { containerPort: 4318,  name: otlp-http }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 20
            periodSeconds: 15
---
# Service para el ingest de trazas (lo usan los microservicios).
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: circleguard-monitoring
  labels: { app: jaeger }
spec:
  selector: { app: jaeger }
  ports:
    - { port: 9411, targetPort: 9411, name: zipkin }
    - { port: 4317, targetPort: 4317, name: otlp-grpc }
    - { port: 4318, targetPort: 4318, name: otlp-http }
---
# Service para la UI / API de consulta (lo usa Grafana y el navegador).
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: circleguard-monitoring
  labels: { app: jaeger }
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - { port: 16686, targetPort: 16686, nodePort: 30686, name: query }

# =====================================================================
# FASE 5 — Kustomization del stack de observabilidad.
# Se aplica con:  kubectl apply -k infra/k8s/monitoring
# Todo el stack vive en el namespace circleguard-monitoring.
# =====================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 10-prometheus.yaml
  - 20-grafana.yaml
  - 30-elk.yaml
  - 40-jaeger.yaml

commonLabels:
  project: circleguard
  stack: observability

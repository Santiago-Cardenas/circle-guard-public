# =====================================================================
# FASE 5 — Prometheus (recolección de métricas)
#
# Incluye:
#   • RBAC: ServiceAccount + ClusterRole + ClusterRoleBinding para que
#     Prometheus pueda descubrir pods/endpoints en todos los namespaces.
#   • ConfigMap con prometheus.yml (kubernetes_sd + relabeling por las
#     anotaciones prometheus.io/* que pusimos en los microservicios).
#   • Deployment + Service (NodePort 30090 para abrir la UI en local).
# =====================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: circleguard-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  # Permisos de SOLO LECTURA para el auto-descubrimiento de targets.
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: circleguard-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: circleguard-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: circleguard-local

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:
      # ---- El propio Prometheus ----
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # ---- Microservicios CircleGuard (auto-descubrimiento por pods) ----
      # Solo se hace scrape de pods con la anotación prometheus.io/scrape=true.
      - job_name: 'circleguard-services'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - circleguard-dev
                - circleguard-stage
                - circleguard-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # Etiquetas útiles para los dashboards de Grafana
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: circleguard-monitoring
data:
  circleguard.yml: |
    groups:
      - name: circleguard.infra
        rules:
          - alert: PodDown
            expr: up{job="circleguard-services"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Servicio {{ $labels.app }} caído"
              description: "El pod {{ $labels.pod }} lleva >1 min sin responder."

          - alert: HighErrorRate
            expr: |
              sum(rate(http_server_requests_seconds_count{status=~"5.."}[2m]))
              /
              sum(rate(http_server_requests_seconds_count[2m])) > 0.10
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Tasa de errores HTTP >10%"
              description: "Más del 10% de las solicitudes devuelven 5xx."

      - name: circleguard.negocio
        rules:
          - alert: AltaTasaBloqueos
            expr: |
              sum(rate(circleguard_validation_blocked_total[5m])) > 5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Muchos bloqueos de acceso (>5/min)"
              description: "Puede indicar un brote activo o una prueba de carga."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: circleguard-monitoring
  labels: { app: prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      # Hardening: corre como usuario no-root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=24h"
            - "--web.enable-lifecycle"
          ports: [{ containerPort: 9090 }]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: rules,  mountPath: /etc/prometheus/rules }
            - { name: data,   mountPath: /prometheus }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: rules,  configMap: { name: prometheus-rules } }
        - { name: data,   emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: circleguard-monitoring
  labels: { app: prometheus }
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - { port: 9090, targetPort: 9090, nodePort: 30090 }

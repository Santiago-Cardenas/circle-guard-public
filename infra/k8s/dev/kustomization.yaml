apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: circleguard-dev

resources:
  - ../base

commonLabels:
  env: dev

# En dev usamos las imágenes con tag :dev (default del base)
images:
  - { name: circleguard/auth,         newTag: dev }
  - { name: circleguard/identity,     newTag: dev }
  - { name: circleguard/gateway,      newTag: dev }
  - { name: circleguard/promotion,    newTag: dev }
  - { name: circleguard/notification, newTag: dev }
  - { name: circleguard/dashboard,    newTag: dev }
